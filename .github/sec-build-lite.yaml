    Fingerprint: sha256:359c2a66c7d30b5cbb932fc5df225b29e11dcf0c2d7eb8a1022550c4a64cb4ef
    Title: 'python: cpython: CPython: tarfile extraction filter bypass allows escaping the destination directory'
    Description: "tarfile.extractall() with the 'data' or 'tar'\n filter could be bypassed by a crafted archive where a hardlink \nreferences a symlink stored at a deeper name than the hardlink itself.\_ \nThe extraction fallback validated the symlink at it's archived location \nbut recreated it at the hardlink's shallower\npath, letting a relative\n target the filter judged contained escape the destination directory.\_ \nThis allowed a malicious tar archive to create a symlink pointing \noutside the destination, enabling out-of-destination file reads or \nwrites. This was an incomplete fix of CVE-2025-4330."
    Severity: HIGH
